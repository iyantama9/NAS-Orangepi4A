services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: nas
    volumes:
      - /opt/nas/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    hostname: orangepi4a
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nas:${POSTGRES_PASSWORD}@db:5432/nas
      NAS_DATA_DIR: /data
      PORT: "3001"
      HOST_HOSTNAME: "orangepi4a"
      HOST_OS: "Debian 12 (bookworm)"
      HOST_IP: "192.168.1.14"
      TAILSCALE_IP: "100.82.5.51"
    ports:
      - "3001:3001"
    volumes:
      - /opt/nas/data:/data
      - /etc/os-release:/etc/host-os-release:ro
      - /etc/hostname:/etc/host-hostname:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    profiles:
      - tunnel
